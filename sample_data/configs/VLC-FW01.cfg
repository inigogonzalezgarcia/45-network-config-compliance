        set notify-hosts 10.10.0.21
        set security-level auth-priv
        set auth-proto sha256
        set auth-pwd ENC 5INHsJqbaWc.s7MbzMBR0XGpZQLmPNoOENxc5nnyKpkvKS/7
        set priv-proto aes256
        set priv-pwd ENC RcJGxkNmdtblfV/JbmkASvgj0svDoYP.S8SHH5wUtyi4hcLN
    next
end
config log syslogd setting
    set status enable
    set server "10.10.0.20"
end
config firewall policy
    edit 1
        set name "LAN-to-Internet"
        set srcintf "internal"
        set dstintf "wan1"
        set action accept
        set srcaddr "LAN-USERS"
        set dstaddr "all"
        set schedule "always"
        set service "HTTP" "HTTPS" "DNS"
        set nat enable
    next
    edit 2
        set name "Servers-to-Updates"
        set srcintf "internal"
        set dstintf "wan1"
        set action accept
        set srcaddr "SERVERS"
        set dstaddr "UPDATE-SERVERS"
        set schedule "always"
        set service "HTTPS"
        set logtraffic all
        set nat enable
    next
    edit 3
        set name "Scanners-to-WMS"
        set srcintf "internal"
        set dstintf "wan1"
        set action accept
        set srcaddr "SCANNERS"
        set dstaddr "WMS-SAAS"
        set schedule "always"
        set service "HTTPS"
        set logtraffic all
        set nat enable
    next
    edit 4
        set name "OLD-ERP-sync"
        set srcintf "internal"
        set dstintf "wan1"
        set action accept
        set srcaddr "ERP-OLD"
        set dstaddr "ERP-HOSTING"
        set schedule "always"
        set service "HTTPS"
        set logtraffic all
        set nat enable
        set status disable
        set comments "Disabled 2026-04-02 after the ERP migration, CHG0039876"
    next
