config system global
    set admintimeout 10
    set alias "VLC-FW01"
    set hostname "VLC-FW01"
    set pre-login-banner enable
end
config system interface
    edit "wan1"
        set ip 203.0.113.66 255.255.255.248
        set allowaccess ping
        set type physical
        set role wan
    next
    edit "internal"
        set ip 10.30.250.4 255.255.255.248
        set allowaccess ping
        set type hard-switch
        set role lan
    next
    edit "MGMT"
        set vdom "root"
        set ip 10.30.10.5 255.255.255.0
        set allowaccess ping https ssh
        set role lan
        set interface "internal"
        set vlanid 10
    next
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set vdom "root"
        set trusthost1 10.10.0.0 255.255.255.0
        set password ENC SH2fkBFfUyLYHS/qqLK91NSkYBpIoqkFtPWhGXcC7ZmWFvFWzV6p/1JxVtJWI7w
    next
    edit "oxidized"
        set accprofile "read_only_backup"
        set vdom "root"
        set trusthost1 10.10.0.40 255.255.255.255
        set password ENC SH2sQUr43Z192EjH8e2BwvNqw/Hiwz2LvVBBrr0hlo25NO9rb1ayvpNUoLhYSnI
    next
end
config system ntp
    set ntpsync enable
    set type custom
